name: Build Mind Lab APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [index.html, icon.png, .github/workflows/build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project (Capacitor)
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp index.html www/index.html
          npx cap init "Mind Lab" com.shinapps.mindlab --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply Mind Lab icon (from icon.png)
        run: |
          pip install pillow
          python3 - <<'PYEOF'
          import os
          from PIL import Image, ImageDraw
          res = 'android/app/src/main/res'
          src = Image.open('icon.png').convert('RGBA')
          dens = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          def mask(size, shape):
              m = Image.new('L',(size*4,size*4),0); d = ImageDraw.Draw(m)
              if shape == 'round': d.ellipse([0,0,size*4-1,size*4-1], fill=255)
              else: d.rounded_rectangle([0,0,size*4-1,size*4-1], radius=int(size*4*0.22), fill=255)
              return m.resize((size,size), Image.LANCZOS)
          for name, l in dens.items():
              d = f'{res}/mipmap-{name}'; os.makedirs(d, exist_ok=True)
              icon = src.resize((l,l), Image.LANCZOS)
              for fn, shape in (('ic_launcher','square'),('ic_launcher_round','round')):
                  out = Image.new('RGBA',(l,l),(0,0,0,0)); out.paste(icon,(0,0),mask(l,shape)); out.save(f'{d}/{fn}.png')
              fg = src.resize((int(108*l/48),int(108*l/48)), Image.LANCZOS)
              fg.save(f'{d}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ml_brand"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for fn in ('ic_launcher.xml','ic_launcher_round.xml'):
              open(f'{res}/mipmap-anydpi-v26/{fn}','w').write(adaptive)
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/ml_colors.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ml_brand">#FFFFFF</color>\n</resources>\n')
          print('icons generated')
          PYEOF

      - name: Set version number
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "No KEYSTORE_B64 secret found: building a debug APK for testing."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Sign release APK (only if KEYSTORE_B64 is set)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > ml.jks
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ml.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS --out MindLab.apk aligned.apk
          "$BT/apksigner" verify MindLab.apk

      - name: Copy debug APK (only if no secret)
        if: ${{ secrets.KEYSTORE_B64 == '' }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MindLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MindLab-apk
          path: MindLab.apk

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" MindLab.apk --title "Mind Lab build ${{ github.run_number }}" --notes "Download MindLab.apk on your Android phone and install it." --latest
